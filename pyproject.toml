[project]
name = "molecule-flash-attention"
version = "0.1.0"
description = "Flash attention for molecules and graphs, with structural attention biases computed inside the kernel"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Maciej Wiśniewski", email = "m.wisniewski@datascience.edu.pl" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.14"]
keywords = ["attention", "flash-attention", "triton", "molecules", "graph-transformer"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Repository = "https://github.com/maciek-wisniewski/molecule-flash-attention"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["torch-ext/molflash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device"]

[tool.ruff]
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Lines of generated Triton source are kept whole so the generated kernel reads like code.
"torch-ext/molflash/kernels.py" = ["E501"]
